<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Week, Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a plain white chat. The assistant answers with text plus inline components (week map, exercise demo, calendar, checklist). Add #debug to the URL to see the data log. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F5F4; --user:#F1F2F1; --ink:#1A1F1D; --ink-2:#5C6661; --line:#E1E6E3; --grid:#EEF1EF;
  --legs:#2D6CDF; --push:#D4552A; --pull:#7A4DCB; --core:#14896A; --neutral:#A9B6B0;
  --warn:#8A5A00; --warn-bg:#FCF1D6; --warn-line:#E0A92E;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.app.show-panel{grid-template-columns:minmax(0,1fr) 380px}
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{margin:0;max-width:780px;margin-inline:auto;font:600 15px/1.2 var(--font-head);color:var(--ink-2)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:780px;margin:0 auto;padding-block:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

.msg.user{align-self:flex-end;max-width:85%}
.bubble{background:var(--user);border-radius:18px;padding:9px 16px}
.act{align-self:flex-end;font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:99px;padding:3px 12px;max-width:90%}
.act b{font-weight:600;color:var(--ink)}
.msg.ai{min-width:0}
.txt,.after{font-size:15.5px;line-height:1.65}
.txt{min-height:26px}
.after{margin-top:14px}
.after:empty{display:none}
.txt b,.after b{font-weight:600}
.w{display:inline-block;opacity:0;transition:opacity .25s}
.w.on{opacity:1}
.dots{display:inline-flex;gap:4px;padding-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.slot{min-width:0}
.slot>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.composer{background:var(--bg);padding-block:6px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer-in{max-width:780px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;text-align:left}
.chip:hover{border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px;box-shadow:0 2px 10px rgba(20,30,25,.07)}
.row input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:8px 0}
.send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;font-size:18px;line-height:1}
.busy .composer{opacity:.6;pointer-events:none}

/* week component */
.wk{--ppm:3.1px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-top:12px}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.wk-title{font:600 15px/1.3 var(--font-head)}
.wk-sub{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.col{min-width:0}
.dh{display:flex;flex-direction:column;padding:0 2px 6px;cursor:pointer;min-height:52px}
.dn{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dt{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dm.cap{text-decoration:underline dotted;text-underline-offset:2px}
.col.sel .dn{box-shadow:0 2px 0 var(--ink)}
.col.flag .dt{color:var(--warn);font-weight:600}
.area{position:relative;height:calc(75*var(--ppm));border-radius:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(15*var(--ppm) - 1px),var(--grid) calc(15*var(--ppm) - 1px),var(--grid) calc(15*var(--ppm)))}
.col.drop .area{outline:2px dashed var(--ink);outline-offset:2px;background-color:color-mix(in srgb,var(--ink) 6%,transparent)}
.restmark{height:calc(15*var(--ppm));border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--ink-2);cursor:pointer}
.blk{position:absolute;left:0;right:0;top:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:grab;touch-action:none;user-select:none}
.blk.changed{border-color:var(--warn-line);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn-line) 55%,transparent)}
.blk.dragging{opacity:.3}
.seg{height:calc(var(--t)*var(--ppm));display:flex;align-items:center;gap:4px;padding:0 5px;font-size:11px;line-height:1.1;border-left:3px solid var(--m);background:color-mix(in srgb,var(--m) 17%,var(--surface));border-bottom:1px solid var(--surface);overflow:hidden;white-space:nowrap}
.seg .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg .ss{color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg.warm{--m:var(--neutral);background:var(--surface-2);color:var(--ink-2)}
.seg.new{box-shadow:inset 0 0 0 2px var(--warn-line)}
.grip{position:absolute;left:0;right:0;bottom:0;height:14px;cursor:ns-resize;touch-action:none;display:grid;place-items:center;background:linear-gradient(transparent,color-mix(in srgb,var(--ink) 18%,transparent))}
.grip i{width:22px;height:3px;border-radius:2px;background:var(--ink);opacity:.55}
.hatch{position:absolute;left:0;right:0;border:1.5px dashed var(--warn-line);border-radius:8px;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--warn-line) 40%,transparent) 5px 6px);font-size:10px;font-weight:600;color:var(--warn);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--m)}
.tip{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.warnbar{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:8px;padding:7px 11px;font-size:13px}
.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.hint{margin:0;color:var(--ink-2);font-size:13px}
.det-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.det-h h3{margin:0;font:600 15px/1.3 var(--font-head)}
.det-h label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.det-h select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px}
.why{color:var(--ink-2);font-size:14px;margin:6px 0 8px;max-width:64ch}
.exr{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.exr .dot{width:8px;height:8px;border-radius:50%;background:var(--m)}
.exr .sr,.exr .mn{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.exr.rm .nm{text-decoration:line-through;color:var(--ink-2)}
.exr.rm .dot{background:transparent;border:1.5px dashed var(--warn-line)}
.acts{display:flex;gap:6px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);margin-left:6px;white-space:nowrap}
.lk{background:none;border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:12px;white-space:nowrap}
.lk:hover{background:var(--surface-2)}
.vol{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.vol h4{margin:0 0 8px;font:600 12px/1 var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.vrow{display:grid;grid-template-columns:48px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:12px;margin-bottom:6px}
.vbar{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.vfill{height:100%;border-radius:4px;background:var(--m)}
.vtick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.vnum{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.vnum.ch{color:var(--warn);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end;height:46px;margin-top:8px}
.mini div{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px;text-align:center;font-size:10px;color:var(--ink-2)}
.mini .bar{border-radius:3px;background:var(--m);opacity:.8}
.mini .rs{height:2px;background:var(--line)}
.wk.old{padding:10px 14px;opacity:.78}
.wk.old .wk-title{font-size:13px;font-weight:500;color:var(--ink-2)}

/* exercise demo */
.demo{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:18px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--surface)}
.demo-fig{min-width:0}
.fig{width:100%;display:block;background:var(--surface-2);border-radius:12px}
.scrub{display:flex;align-items:center;gap:10px;margin-top:8px}
.scrub button{background:none;border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;min-width:64px}
.scrub input{flex:1;min-width:0;accent-color:var(--ink)}
.demo h3{margin:0;font:600 17px/1.3 var(--font-head)}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chipsrow span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--ink-2)}
.chipsrow span.m{border-color:var(--m);color:var(--m);font-weight:600}
.demo ol{margin:0 0 10px;padding-left:20px;display:grid;gap:4px;font-size:14px}
.demo .mistake{margin:0;font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:6px 10px}
.demo .fine{margin:8px 0 0;font-size:12px;color:var(--ink-2)}

/* alternatives */
.demo.inline{margin:6px 0 10px;animation:rise .25s ease both}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--ink)}
.opt .fig{height:84px;border-radius:8px}
.opt h4{margin:6px 0 0;font:600 14px/1.3 var(--font-head);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.opt p{margin:0;font-size:13px;color:var(--ink-2)}
.opt .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.opt .meta span{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--ink-2)}
.opt .rec{font-size:11px;font-weight:600;color:var(--core)}
.opts[data-done] .opt{opacity:.5;pointer-events:none}

/* final + calendar */
.fin,.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.fin-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.fd{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.fd h3{margin:0;font:600 15px/1.3 var(--font-head);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fd .sub{font-size:12px;color:var(--ink-2);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--ink)}
.ck .sr{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.ck input:checked~.nm{text-decoration:line-through;color:var(--ink-2)}
.fin-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 13px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal-opts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-size:13px;color:var(--ink-2);align-items:center}
.cal-opts label{display:flex;align-items:center;gap:6px}
.cal-opts input[type=time]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface)}
.cal-opts input[type=checkbox]{accent-color:var(--ink)}
.cal-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.cal-row b{font-weight:600}
.cal-row small{display:block;color:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.cal-foot{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cal-foot .note{display:block;margin-top:8px;font-size:12px;color:var(--ink-2)}

/* data log, only visible with #debug in the URL */
.panel{display:none;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border-left:1px solid var(--line)}
.app.show-panel .panel{display:flex}
.panel h2{margin:0;padding:12px 14px;font:600 14px/1.3 var(--font-head);border-bottom:1px solid var(--line)}
.log{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px}
.le{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12px}
.le summary{padding:6px 9px;cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none}
.le summary::-webkit-details-marker{display:none}
.le .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;white-space:nowrap}
.le.ai .k{background:var(--ink);color:#fff}
.le.ui .k{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.le.local .k{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.le pre{margin:0;padding:8px 10px 10px;border-top:1px solid var(--line);font:11px/1.5 var(--font-mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1000px){
  .app.show-panel{grid-template-columns:minmax(0,1fr)}
  .app.show-panel .panel{position:fixed;inset:0 0 0 auto;width:min(380px,100%);z-index:40;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
}
@media (max-width:640px){
  .wk{--ppm:2.3px;padding:12px 10px}
  .grid{gap:3px}
  .seg .sn,.seg .ss,.dt{display:none}
  .seg{padding:0}
  .dn{font-size:10px;letter-spacing:.02em}
  .dm{font-size:9.5px}
  .exr{grid-template-columns:10px minmax(0,1fr) auto auto}
  .exr .acts{grid-column:2/-1}
  .vrow{grid-template-columns:44px minmax(0,1fr) 64px}
  .demo{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.slot>*{animation:none}.dots i{animation:none}.w{transition:none}}
</style>

<div class="app" id="app">
  <main class="chat">
    <header class="top"><h1>Plan your workout!</h1></header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <form class="composer" id="form" autocomplete="off">
      <div class="composer-in">
        <div class="chips" id="chips"></div>
        <div class="row">
          <label class="sr-only" for="msg">Message</label>
          <input id="msg" type="text" placeholder="Message">
          <button class="send" type="submit" aria-label="Send">&#8593;</button>
        </div>
      </div>
    </form>
  </main>
  <aside class="panel" id="panel" aria-label="Data log"><h2>Data log</h2><div class="log" id="log"></div></aside>
</div>

<script>
(function(){
'use strict';
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DAYNAME={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
var MUS={legs:{l:'Legs'},push:{l:'Push'},pull:{l:'Pull'},core:{l:'Core'}};
var MORDER=['legs','push','pull','core'];
var WARM=5, MAXMIN=75, MINMIN=20;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild}
function sleep(ms){return new Promise(function(r){setTimeout(r,reduce?Math.min(ms,50):ms)})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function fmt(m){var h=Math.floor(m/60),r=m%60;return (h?h+' h ':'')+(r||!h?r+' min':'')}
function lc(s){return s.toLowerCase()}
function pad(n){return (n<10?'0':'')+n}

/* ---------- plan data ---------- */
function X(id,n,m,s,r,t,p,eq){return {id:id,n:n,m:m,s:s,r:r,t:t,p:p,eq:eq}}
function newPlan(){return {
  schedule:{Mon:'lower',Tue:null,Wed:'push',Thu:null,Fri:'pull',Sat:null,Sun:null},
  sessions:{
    lower:{key:'lower',nm:'lower-body',target:null,
      why:'Squats come first, while your legs are fresh and you can load them. Single-leg work and the hinge follow once the heavy lift is done. Core goes last so a tired trunk does not cap your squat.',
      ex:[X('goblet','Goblet squat','legs',3,'10',9,1,'a dumbbell'),X('stepup','Step-ups','legs',3,'10/leg',10,2,'a box and dumbbells'),X('rdl','Romanian deadlift','legs',3,'10',9,2,'a barbell'),X('calf','Calf raise','legs',3,'15',6,4,'a machine'),X('plank','Plank','core',3,'40 s',6,3,'bodyweight')]},
    push:{key:'push',nm:'push',target:null,
      why:'Pressing is the heaviest work, so the chest press goes first and the shoulder press second. Small-muscle work like triceps and side delts comes last because those muscles are already warm from the presses.',
      ex:[X('bench','Dumbbell bench press','push',4,'8',13,1,'dumbbells and a bench'),X('ohp','Overhead press','push',3,'8',10,2,'dumbbells'),X('incline','Incline dumbbell press','push',3,'10',9,3,'dumbbells and a bench'),X('tri','Triceps pushdown','push',3,'12',7,4,'a cable stack'),X('lat','Lateral raise','push',3,'15',6,5,'dumbbells')]},
    pull:{key:'pull',nm:'pull',target:null,
      why:'Rows and pulldowns lead while your grip and back are fresh. The hip thrust gives your legs a lighter second hit that stays well clear of your main leg day. Curls and core finish the session.',
      ex:[X('row','Seated cable row','pull',4,'10',12,1,'a cable stack'),X('pd','Lat pulldown','pull',3,'10',9,1,'a cable stack'),X('hip','Hip thrust','legs',3,'12',8,2,'a barbell and bench'),X('curl','Dumbbell curl','pull',3,'12',6,4,'dumbbells'),X('dead','Dead bug','core',3,'10',5,3,'bodyweight')]}
  }};}

/* ---------- plan logic ---------- */
function eff(s,override){
  var target=override!==undefined?override:s.target;
  var kept=s.ex.slice(),removed=[];
  var full=WARM+sum(kept,function(e){return e.t});
  if(target!=null){
    var order=kept.map(function(e,i){return {e:e,i:i}}).sort(function(a,b){return b.e.p-a.e.p||b.i-a.i});
    var total=full,rm={};
    for(var k=0;k<order.length;k++){
      if(total<=target||kept.length-Object.keys(rm).length<=1)break;
      rm[order[k].e.id]=1;total-=order[k].e.t;
    }
    removed=kept.filter(function(e){return rm[e.id]});
    kept=kept.filter(function(e){return !rm[e.id]});
  }
  return {kept:kept,removed:removed,minutes:WARM+sum(kept,function(e){return e.t}),full:full};
}
function setsBy(list){var o={legs:0,push:0,pull:0,core:0};list.forEach(function(e){o[e.m]+=e.s});return o}
function focus(e){var o=setsBy(e.kept);return MORDER.filter(function(m){return o[m]>=3}).sort(function(a,b){return o[b]-o[a]}).slice(0,2).map(function(m){return MUS[m].l}).join(' + ')||'Session'}
function mainMuscle(e){var o=setsBy(e.kept);return MORDER.slice().sort(function(a,b){return o[b]-o[a]})[0]}
function dayOf(plan,key){for(var i=0;i<DAYS.length;i++)if(plan.schedule[DAYS[i]]===key)return DAYS[i];return null}
function volumes(plan){var o={legs:0,push:0,pull:0,core:0};Object.keys(plan.sessions).forEach(function(k){var s=setsBy(eff(plan.sessions[k]).kept);MORDER.forEach(function(m){o[m]+=s[m]})});return o}
function conflicts(plan){
  var md={legs:[],push:[],pull:[],core:[]};
  DAYS.forEach(function(d,i){var k=plan.schedule[d];if(!k)return;var s=setsBy(eff(plan.sessions[k]).kept);MORDER.forEach(function(m){if(s[m]>=3)md[m].push(i)})});
  var out=[],minGap=7;
  MORDER.forEach(function(m){var idx=md[m];if(idx.length<2)return;
    for(var i=0;i<idx.length;i++){var a=idx[i],b=idx[(i+1)%idx.length];var gap=(b-a+7)%7;if(gap===0)gap=7;minGap=Math.min(minGap,gap);if(gap<2)out.push({m:m,a:a,b:b,gap:gap});}});
  out.minGap=minGap;return out;
}
function diff(prev,cur){
  var out={sessions:{},volPrev:volumes(prev)};
  Object.keys(cur.sessions).forEach(function(k){
    var pe=eff(prev.sessions[k]),ce=eff(cur.sessions[k]);
    var pids={},cids={};pe.kept.forEach(function(x){pids[x.id]=1});ce.kept.forEach(function(x){cids[x.id]=1});
    var prevFull={};prev.sessions[k].ex.forEach(function(x){prevFull[x.id]=1});
    var added=ce.kept.filter(function(x){return !pids[x.id]}).map(function(x){return {id:x.id,kind:x.swappedFrom?'swap':(prevFull[x.id]?'restored':'moved')}});
    var removed=pe.kept.filter(function(x){return !cids[x.id]}).map(function(x){
      var reason='Cut for time';
      Object.keys(cur.sessions).forEach(function(k2){if(k2!==k&&eff(cur.sessions[k2]).kept.some(function(y){return y.id===x.id}))reason='Moved to '+dayOf(cur,k2)});
      if(ce.kept.some(function(y){return y.swappedFrom===x.n}))reason='Replaced';
      return {id:x.id,n:x.n,m:x.m,s:x.s,r:x.r,t:x.t,reason:reason};});
    var d0=dayOf(prev,k),d1=dayOf(cur,k);
    var moved=d0!==d1?{from:d0,to:d1}:null;
    var delta=ce.minutes-pe.minutes;
    out.sessions[k]={added:added,removed:removed,moved:moved,delta:delta,prevMinutes:pe.minutes,changed:!!(added.length||removed.length||moved||delta)};
  });
  return out;
}

  if(/(how (do|to|can|should).*(do|perform|use)|show me how|what does .*look like|demo|proper form|technique|form for)/.test(t)&&any)return fire({type:'show_demo',id:any},SILENT);
  if(/calendar|google cal|apple cal|icloud|ical|outlook|remind me/.test(t)){
    if(!plan)return fire(T('Let us build the week first. Ask me for a plan and I will add it to your calendar afterward.','no plan yet'),SILENT);
    return fire({type:'show_calendar'},SILENT);
  }
  if(!plan){
    if(/plan|routine|workout|schedule|week|program/.test(t))return fire({type:'ask_plan'},SILENT);
    return fire(T('I can plan your training week, show you how to do an exercise, or answer a training question. What would you like?','unrecognized'),SILENT);
  }
  if(/final|summary|ready for the gym|show me my (routine|plan)|checklist/.test(t))return fire({type:'request_final'},SILENT);
  if(days.length>=2&&/move|switch|swap|shift|put|reschedule/.test(t)){
    var a=days[0],b=days[1];
    if(!plan.schedule[a]&&plan.schedule[b]){var x=a;a=b;b=x}
    if(plan.schedule[a])return fire({type:'move_session',from:a,to:b},SILENT);
    return fire(T('There is no session on '+DAYNAME[a]+' to move.','no session'),SILENT);
  }
  if(mm&&days.length&&plan.schedule[days[0]]&&/min|only|have|time/.test(t))return fire({type:'set_duration',day:days[0],minutes:parseInt(mm[1],10)},SILENT);
  if(/(don.?t|do not|hate|dislike|not a fan|swap|replace|instead|something else|alternative)/.test(t)){
    var f=findAny(text,pids);
    if(f)return fire({type:'dislike_exercise',day:pids[f],id:f,name:D[f]?D[f].n:f},SILENT);
    return fire(T('Which exercise do you want to swap? You can also tap <b>Swap</b> next to any exercise in the week.','exercise not found'),SILENT);
  }
  if(/why/.test(t)){
    if(days.length&&plan.schedule[days[0]]){var s=plan.sessions[plan.schedule[days[0]]];return fire(T('<b>'+DAYNAME[days[0]]+':</b> '+esc(s.why),'explanation of one session'),SILENT)}
    if(days.length)return fire(T(DAYNAME[days[0]]+' is a rest day on purpose. Your muscles rebuild between sessions, and that is when the training pays off.','rest day explanation'),SILENT);
    return fire(T('Heavy, tiring lifts go first while you are fresh, small-muscle work goes last, and no muscle group trains on back-to-back days. Tap any day in the week map for the reasoning behind that specific session.','general explanation'),SILENT);
  }
  if(/how many sets|volume|too much|enough (legs|push|pull|core)/.test(t)){var v=volumes(plan);return fire(T('Your weekly sets right now: <b>legs '+v.legs+'</b>, <b>push '+v.push+'</b>, <b>pull '+v.pull+'</b>, <b>core '+v.core+'</b>. The bars at the bottom of the week map show the same numbers and update when you change something.','answer from current plan'),SILENT)}
  if(/plan|routine|workout|schedule|week/.test(t))return fire(T('That is the plan above, with your latest changes. Drag a block to another day, tell me about a time limit, or name an exercise you do not like.','plan already shown'),SILENT);
  return fire(T('I am not sure I followed that. I can change a day\u2019s length, move a session, swap an exercise, show how to do a movement, or add your workouts to a calendar.','unrecognized'),SILENT);
}
function sendText(t){
  if(busy||!t.trim())return;
  addUser(t);
  return route(t);
}

/* ---------- interactions ---------- */
thread.addEventListener('pointerdown',function(e){
  if(busy||e.button>0)return;
  var blk=e.target.closest('.blk'),wEl=e.target.closest('.wk');
  if(!blk||!wEl)return;
  var w=widgets.find(function(x){return String(x.id)===wEl.dataset.w});if(!w||!w.active)return;
  var col=blk.closest('.col'),day=col.dataset.day,key=w.plan.schedule[day],area=blk.parentElement,ppm=area.clientHeight/MAXMIN;
  if(e.target.closest('.grip')){
    e.preventDefault();
    var s=w.plan.sessions[key],full=WARM+sum(s.ex,function(x){return x.t});
    drag={mode:'resize',w:w,key:key,day:day,ppm:ppm,y0:e.clientY,m0:eff(s).minutes,full:full,last:null};
  }else{
    drag={mode:'press',w:w,day:day,x0:e.clientX,y0:e.clientY,moved:false,blk:blk,ghost:null,target:null};
  }
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  var w=drag.w;
  if(drag.mode==='resize'){
    var m=Math.round((drag.m0+(e.clientY-drag.y0)/drag.ppm)/5)*5;m=Math.max(MINMIN,Math.min(drag.full,m));
    if(m!==drag.last){drag.last=m;w.preview={key:drag.key,target:m>=drag.full?null:m};renderWeek(w)}
    return;
  }
  var dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved&&Math.hypot(dx,dy)>6){
    drag.moved=true;
    var r=drag.blk.getBoundingClientRect(),g=drag.blk.cloneNode(true);
    g.className='blk ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.setProperty('--ppm',getComputedStyle(drag.blk).getPropertyValue('--ppm'));
    var g2=g.querySelector('.grip');if(g2)g2.remove();
    drag.ghost=g;drag.gx=r.left;drag.gy=r.top;document.body.appendChild(g);drag.blk.classList.add('dragging');
  }
  if(drag.moved){
    drag.ghost.style.left=(drag.gx+dx)+'px';drag.ghost.style.top=(drag.gy+dy)+'px';
    var c=document.elementFromPoint(e.clientX,e.clientY),col=c&&c.closest('.col'),wEl=c&&c.closest('.wk');
    var tgt=(col&&wEl&&String(w.id)===wEl.dataset.w)?col.dataset.day:null;
    if(tgt!==drag.target){
      w.node.querySelectorAll('.col.drop').forEach(function(x){x.classList.remove('drop')});
      drag.target=tgt;if(tgt&&tgt!==drag.day)col.classList.add('drop');
    }
  }
});
function endDrag(e,cancel){
  if(!drag)return;
  var d=drag;drag=null;var w=d.w;
  if(d.mode==='resize'){
    w.preview=null;renderWeek(w);
    if(!cancel&&d.last!=null&&d.last!==d.m0)fire({type:'set_duration',day:d.day,minutes:d.last});
    return;
  }
  if(d.ghost)d.ghost.remove();
  if(!d.moved){
    if(!cancel){w.selected=d.day;renderWeek(w);log('local','select_day',{type:'select_day',day:d.day,note:'handled inside the component, no message sent to the AI'})}
    return;
  }
  renderWeek(w);
  if(!cancel&&d.target&&d.target!==d.day)fire({type:'move_session',from:d.day,to:d.target});
}
window.addEventListener('pointerup',function(e){endDrag(e,false)});
window.addEventListener('pointercancel',function(e){endDrag(e,true)});

function findById(id){var f=null;if(plan)Object.keys(plan.sessions).forEach(function(k){plan.sessions[k].ex.forEach(function(x){if(x.id===id)f=x})});return f}
thread.addEventListener('click',function(e){
  var t=e.target;
  var how=t.closest('[data-how]');
  if(how){var hwEl=how.closest('.wk'),hw=hwEl&&widgets.find(function(x){return String(x.id)===hwEl.dataset.w});
    if(hw&&hw.active){hw.openDemo=hw.openDemo===how.dataset.how?null:how.dataset.how;renderWeek(hw);log('local','how_to',{type:'how_to',exercise:how.dataset.how,open:!!hw.openDemo,note:'dropdown opened inside the component, no message sent to the AI'})}
    else if(!busy)fire({type:'show_demo',id:how.dataset.how});
    return}
  var wEl=t.closest('.wk');
  if(wEl){
    var w=widgets.find(function(x){return String(x.id)===wEl.dataset.w});
    if(w&&w.active){
      if(t.closest('.blk'))return;
      var dh=t.closest('.dh, .restmark');
      if(dh){var d=t.closest('.col').dataset.day;w.selected=d;renderWeek(w);log('local','select_day',{type:'select_day',day:d,note:'handled inside the component, no message sent to the AI'});return}
      var sw=t.closest('[data-swap]');
      if(sw&&!busy){fire({type:'dislike_exercise',day:sw.dataset.day,id:sw.dataset.swap,name:(findById(sw.dataset.swap)||{}).n});return}
    }
  }
  var opt=t.closest('[data-alt]');
  if(opt&&!busy){var box=opt.closest('.opts');box.dataset.done='1';var nm=opt.querySelector('h4 span').textContent;fire({type:'swap_exercise',alt:opt.dataset.alt,altName:nm});return}
  if(t.closest('[data-cal]')&&!busy){fire({type:'show_calendar'});return}
  var cp=t.closest('[data-copy]');
  if(cp){var txt=planText();var ok=function(){cp.textContent='Copied'};var no=function(){cp.textContent='Copy failed'};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(err){no()}return}
  var pl=t.closest('[data-play]');
  if(pl){var svg=pl.closest('.demo').querySelector('svg'),f=svg&&svg._fig;if(f){if(f.paused||f.scrub!=null){f.paused=false;f.scrub=null;pl.textContent='Pause'}else{f.paused=true;pl.textContent='Play'}}}
});
thread.addEventListener('input',function(e){
  var sl=e.target.closest('[data-scrub]');if(!sl)return;
  var demo=sl.closest('.demo'),svg=demo.querySelector('svg'),f=svg&&svg._fig;if(!f)return;
  f.slider=sl;f.scrub=sl.value/100;demo.querySelector('[data-play]').textContent='Play';
  if(reduce)draw(f,f.scrub);
});
thread.addEventListener('change',function(e){
  var sel=e.target.closest('select[data-move]');
  if(sel&&!busy){var from=sel.dataset.move,to=sel.value;if(from!==to)fire({type:'move_session',from:from,to:to})}
});
thread.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var wEl=e.target.closest('.wk');if(!wEl)return;
  var tgt=e.target.closest('.blk, .restmark');if(!tgt)return;
  var w=widgets.find(function(x){return String(x.id)===wEl.dataset.w});if(!w||!w.active)return;
  e.preventDefault();w.selected=tgt.closest('.col').dataset.day;renderWeek(w);
});

/* ---------- composer ---------- */
$('#form').addEventListener('submit',function(e){e.preventDefault();var i=$('#msg');var v=i.value;i.value='';sendText(v)});

/* ---------- boot ---------- */
(function(){
  var m=addAi();
  reveal(m.txt,'Hi, how can I help?').then(defaultChips);
})();
})();
</script>
</html>
